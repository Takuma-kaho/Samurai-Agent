name: Security

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    name: security-audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit moderate-or-higher dependency vulnerabilities
        run: pnpm audit --audit-level=moderate

      - name: Scan repository for leaked secrets and release hygiene issues
        run: pnpm run core:test:release-hygiene

      - name: Run source quality gate
        run: pnpm run verify:source-quality

      - name: Verify PostgreSQL runtime scope
        run: pnpm run verify:postgres-runtime-scope

      - name: Verify PostgreSQL migration readiness
        # Live PostgreSQL/RLS probes run in the disposable database deep gate.
        # This security job verifies the repository has no legacy imports or
        # API callers without treating an unavailable external database as a
        # code failure.
        run: pnpm run verify:postgres-migration:static
