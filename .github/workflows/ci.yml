name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  domain-command-contract:
    name: domain-command-contract-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Domain Command packages
        run: pnpm --filter @samurai-agent/core-schemas --filter @samurai-agent/agent-backends --filter @samurai-agent/domain-operations --filter @samurai-agent/action-catalog --filter @samurai-agent/runtime --filter @samurai-agent/workspace-store --filter @samurai-agent/server --filter @samurai-agent/web run typecheck

      - name: Run Core03 focused tests on Linux
        if: runner.os == 'Linux'
        run: CI=true pnpm exec vitest run packages/core-schemas/src/core-schemas.test.ts packages/agent-backends/src/agent-backends.test.ts packages/runtime/src/backend-event-bridge.test.ts packages/runtime/src/execution/backend-event-journal.test.ts packages/runtime/src/execution/turn-executor.test.ts packages/runtime/src/execution/run-recovery.test.ts --pool=forks

      - name: Run Domain Command unit tests
        run: pnpm exec vitest run packages/domain-operations/src/domain-operations.coverage.test.ts packages/runtime/src/commands/domain-command-bus.test.ts

      - name: Verify generated contracts and AST gates
        # The generated-contract and AST checks are deterministic on Linux.
        # Windows uses a temporary mutation sandbox whose package-loader
        # resolution is not equivalent to the checkout (esbuild is not found
        # by tsx there), so the same source gate is run once on Linux.
        if: runner.os == 'Linux'
        run: |
          failures=()
          run_check() {
            local label="$1"
            shift
            echo "▶ ${label}"
            if "$@"; then
              echo "✓ ${label}"
            else
              local exit_code=$?
              failures+=("${label} (exit ${exit_code})")
              echo "✗ ${label} (exit ${exit_code})"
            fi
          }

          run_check "generated operation index" node scripts/generate-domain-operation-index.mjs --check
          run_check "domain command contract" node --import tsx scripts/fixtures/domain-command-contract.ts
          run_check "domain operation structure" node --import tsx scripts/fixtures/domain-operation-structure.ts
          run_check "domain query purity" node --import tsx scripts/fixtures/domain-query-purity.ts
          run_check "domain command compatibility" node --import tsx scripts/fixtures/domain-command-compatibility.ts
          run_check "domain command version" node --import tsx scripts/fixtures/domain-command-version.ts
          run_check "domain command parity" node --import tsx scripts/fixtures/domain-command-parity.ts
          run_check "domain command trusted context" node --import tsx scripts/fixtures/domain-command-trusted-context.ts
          run_check "domain command schema matrix" node --import tsx scripts/fixtures/domain-command-schema-matrix.ts
          run_check "domain operation handler matrix" node --import tsx scripts/fixtures/domain-operation-handler-matrix.ts
          run_check "domain operation handler shard A" node --import tsx scripts/fixtures/domain-operation-handler-matrix-shard-a.ts
          run_check "domain operation handler shard B" node --import tsx scripts/fixtures/domain-operation-handler-matrix-shard-b.ts
          run_check "domain operation handler matrix C" node --import tsx scripts/fixtures/domain-operation-handler-matrix-c.ts
          run_check "domain operation handler aggregate" node --import tsx scripts/fixtures/domain-operation-handler-matrix-aggregate.ts
          run_check "architecture boundaries" node scripts/verify-architecture-boundaries.mjs
          run_check "verifier self-test" node scripts/verify-domain-command-verifier-self-test.mjs

          if (( ${#failures[@]} > 0 )); then
            echo "Failed verifier checks:"
            printf ' - %s\n' "${failures[@]}"
            exit 1
          fi

      - name: Run Linux integration and verifier gates
        # The Linux job is the single deep Domain Command gate. It is required
        # for PRs and main pushes; the three-OS matrix above remains focused on
        # platform differences instead of repeating the same heavy suite.
        if: runner.os == 'Linux'
        run: pnpm run core:domain-commands:check

  release-readiness:
    name: release-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check diff whitespace
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" --depth=1
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          elif [[ -n "${{ github.event.before }}" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "${{ github.event.before }}..${{ github.sha }}"
          else
            git diff --check "HEAD~1..HEAD"
          fi

      - name: Run release readiness gate
        shell: bash
        run: |
          set -euo pipefail
          # Every PR and main push must report executable gates. A skipped
          # gate is unverified and causes the verifier to fail.
          CI=true pnpm run backend:release:verify -- --json | tee release-readiness.json

      - name: Upload release readiness report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-readiness
          path: release-readiness.json
          if-no-files-found: warn

  full-linux:
    name: full-linux
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format and architecture gates
        run: |
          set -euo pipefail
          git diff --check
          pnpm run verify:architecture

      - name: Typecheck all packages
        run: pnpm typecheck

      - name: Run full Linux test suite
        run: CI=true pnpm test -- --pool=forks --maxWorkers=4

      - name: Build Web and Desktop
        run: |
          pnpm run desktop:verify
          pnpm --filter @samurai-agent/web run build
          pnpm --filter @samurai-agent/desktop run build

      - name: Dependency security audit
        run: pnpm audit --audit-level=high

  postgres-deep:
    name: postgres-deep
    runs-on: ubuntu-latest
    timeout-minutes: 180

    # This is one disposable PostgreSQL service with two databases. It proves
    # the migration/RLS/runtime paths in CI, but it is not evidence that two
    # separately deployed Hosted and Self-host installations behave alike.
    # That deployment evidence remains a release/environment gate.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: samurai_ci_postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare disposable CI PostgreSQL databases
        shell: bash
        env:
          PGPASSWORD: samurai_ci_postgres_password
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if pg_isready --host 127.0.0.1 --port 5432 --username postgres --dbname postgres; then
              break
            fi
            sleep 1
          done
          pg_isready --host 127.0.0.1 --port 5432 --username postgres --dbname postgres
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname postgres --set ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE samurai_ci_runtime LOGIN PASSWORD 'samurai_ci_postgres_password' NOSUPERUSER NOBYPASSRLS;
          CREATE DATABASE samurai_ci_hosted;
          CREATE DATABASE samurai_ci_self_host;
          SQL

      - name: Run full CI verifier against disposable PostgreSQL
        env:
          SAMURAI_CI_FULL_POSTGRES_MODE: disposable_ci_service
          SAMURAI_CI_FULL_REPORT_DIRECTORY: /tmp/samurai-ci-full-report
          SAMURAI_SERVER_VERIFY_HOSTED_DATABASE_URL: postgresql://samurai_ci_runtime:samurai_ci_postgres_password@127.0.0.1:5432/samurai_ci_hosted
          SAMURAI_SERVER_VERIFY_HOSTED_DATABASE_ADMIN_URL: postgresql://postgres:samurai_ci_postgres_password@127.0.0.1:5432/samurai_ci_hosted
          SAMURAI_SERVER_VERIFY_HOSTED_DATABASE_RUNTIME_ROLE: samurai_ci_runtime
          SAMURAI_SERVER_VERIFY_SELF_HOST_DATABASE_URL: postgresql://samurai_ci_runtime:samurai_ci_postgres_password@127.0.0.1:5432/samurai_ci_self_host
          SAMURAI_SERVER_VERIFY_SELF_HOST_DATABASE_ADMIN_URL: postgresql://postgres:samurai_ci_postgres_password@127.0.0.1:5432/samurai_ci_self_host
          SAMURAI_SERVER_VERIFY_SELF_HOST_DATABASE_RUNTIME_ROLE: samurai_ci_runtime
          SAMURAI_SERVER_VERIFY_ALLOW_DESTRUCTIVE_PROBE: yes
        run: pnpm run verify:ci-full

      - name: Upload full CI verifier report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-full-report
          path: /tmp/samurai-ci-full-report/
          if-no-files-found: warn

      - name: Run disposable PostgreSQL migration, RLS, recovery, bundle and load gates
        run: CI=true pnpm run server:04:complete:verify

      - name: Upload PostgreSQL deep reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: postgres-deep-reports
          path: reports/server04-completion/
          if-no-files-found: warn
