name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  domain-command-contract:
    name: domain-command-contract-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Domain Command packages
        run: pnpm --filter @samurai-agent/core-schemas --filter @samurai-agent/agent-backends --filter @samurai-agent/domain-operations --filter @samurai-agent/action-catalog --filter @samurai-agent/runtime --filter @samurai-agent/workspace-store --filter @samurai-agent/server --filter @samurai-agent/web run typecheck

      - name: Run Core03 focused tests on Linux
        if: runner.os == 'Linux'
        run: CI=true pnpm exec vitest run packages/core-schemas/src/core-schemas.test.ts packages/agent-backends/src/agent-backends.test.ts packages/runtime/src/backend-event-bridge.test.ts packages/runtime/src/execution/backend-event-journal.test.ts packages/runtime/src/execution/turn-executor.test.ts packages/runtime/src/execution/run-recovery.test.ts --pool=forks

      - name: Run Domain Command unit tests
        run: pnpm exec vitest run packages/domain-operations/src/domain-operations.coverage.test.ts packages/runtime/src/commands/domain-command-bus.test.ts

      - name: Verify generated contracts and AST gates
        # The generated-contract and AST checks are deterministic on Linux.
        # Windows uses a temporary mutation sandbox whose package-loader
        # resolution is not equivalent to the checkout (esbuild is not found
        # by tsx there), so the same source gate is run once on Linux.
        if: runner.os == 'Linux'
        run: |
          failures=()
          run_check() {
            local label="$1"
            shift
            echo "▶ ${label}"
            if "$@"; then
              echo "✓ ${label}"
            else
              local exit_code=$?
              failures+=("${label} (exit ${exit_code})")
              echo "✗ ${label} (exit ${exit_code})"
            fi
          }

          run_check "generated operation index" node scripts/generate-domain-operation-index.mjs --check
          run_check "domain command contract" node --import tsx scripts/fixtures/domain-command-contract.ts
          run_check "domain operation structure" node --import tsx scripts/fixtures/domain-operation-structure.ts
          run_check "domain query purity" node --import tsx scripts/fixtures/domain-query-purity.ts
          run_check "domain command compatibility" node --import tsx scripts/fixtures/domain-command-compatibility.ts
          run_check "domain command version" node --import tsx scripts/fixtures/domain-command-version.ts
          run_check "domain command parity" node --import tsx scripts/fixtures/domain-command-parity.ts
          run_check "domain command trusted context" node --import tsx scripts/fixtures/domain-command-trusted-context.ts
          run_check "domain command schema matrix" node --import tsx scripts/fixtures/domain-command-schema-matrix.ts
          run_check "domain operation handler matrix" node --import tsx scripts/fixtures/domain-operation-handler-matrix.ts
          run_check "domain operation handler shard A" node --import tsx scripts/fixtures/domain-operation-handler-matrix-shard-a.ts
          run_check "domain operation handler shard B" node --import tsx scripts/fixtures/domain-operation-handler-matrix-shard-b.ts
          run_check "domain operation handler matrix C" node --import tsx scripts/fixtures/domain-operation-handler-matrix-c.ts
          run_check "domain operation handler aggregate" node --import tsx scripts/fixtures/domain-operation-handler-matrix-aggregate.ts
          run_check "architecture boundaries" node scripts/verify-architecture-boundaries.mjs
          run_check "verifier self-test" node scripts/verify-domain-command-verifier-self-test.mjs

          if (( ${#failures[@]} > 0 )); then
            echo "Failed verifier checks:"
            printf ' - %s\n' "${failures[@]}"
            exit 1
          fi

      - name: Run Linux integration and verifier gates
        # This is the deep integration/release gate. Keep it out of the fast
        # pull-request contract so a Core change is not blocked by unrelated
        # full-ledger telemetry work; run it explicitly from workflow_dispatch.
        if: runner.os == 'Linux' && github.event_name == 'workflow_dispatch'
        run: pnpm run core:domain-commands:check

  release-readiness:
    name: release-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check diff whitespace
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" --depth=1
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          elif [[ -n "${{ github.event.before }}" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "${{ github.event.before }}..${{ github.sha }}"
          else
            git diff --check "HEAD~1..HEAD"
          fi

      - name: Run release readiness gate
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Full non-destructive release verification is an explicit manual
            # release check. It includes the full Vitest suite and probes.
            CI=true pnpm run backend:release:verify -- --json | tee release-readiness.json
          else
            # Pull requests and main pushes use the fast product-health gates:
            # typecheck, i18n, web build, doctor, naming, and gateway recovery.
            # Focused Domain Command tests run in the matrix job above. The
            # skipped gates remain available through workflow_dispatch.
            CI=true pnpm run backend:release:verify -- --json --skip-tests --skip-external-probes --skip-sandbox-probes | tee release-readiness.json
          fi

      - name: Upload release readiness report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-readiness
          path: release-readiness.json
          if-no-files-found: warn
